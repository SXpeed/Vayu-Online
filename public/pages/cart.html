<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart — Vayu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css?v=118">
    <style>
        /* ------------------------------------------------------------
           Cart — minimal, compact.
           Note: the global layer in styles.css forces
           border-color: transparent !important, so separators here are
           drawn as 1px pseudo-element backgrounds instead of borders.
           ------------------------------------------------------------ */
        /* no horizontal padding — this element is also .wrap, whose
           --page-pad gutter is the only one the page should have (declaring
           any value here, 0 included, would replace it) */
        /* clearance for the mobile bottom nav — scoped to the widths where
           that bar exists, so desktop does not carry 72px of dead space
           between the last row and the footer */
        @media (max-width: 768px) {
            .cart-page {
                padding-bottom: 72px;
            }
        }

        /* ---------- header ---------- */
        .cart-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding-bottom: 10px;
        }

        .cart-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(22px, 2.4vw, 28px);
            font-weight: 400;
            color: var(--ink);
            letter-spacing: 0.01em;
            line-height: 1.1;
            margin: 0;
        }

        .cart-count {
            font-family: 'Jost', sans-serif;
            font-size: 10.5px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #8A8681;
            white-space: nowrap;
        }

        /* ---------- layout ---------- */
        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 268px;
            gap: 40px;
            align-items: start;
        }

        /* ---------- items ---------- */
        .cart-item {
            position: relative;
            display: grid;
            grid-template-columns: 88px 1fr auto;
            gap: 14px;
            align-items: center;
            padding: 12px 0;
            transition: opacity 0.28s ease;
        }

        /* hairline between rows only — no box, no outer rules */
        .cart-item+.cart-item::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 1px;
            background: #F0EDE7;
        }

        .cart-item.removing {
            opacity: 0;
        }

        .cart-item-img {
            width: 88px;
            height: 88px;
            overflow: hidden;
            background: #FAF8F5;
        }

        .cart-item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .cart-item:hover .cart-item-img img {
            transform: scale(1.04);
        }

        .cart-item-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .cart-item-cat {
            font-family: 'Jost', sans-serif;
            font-size: 9px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 500;
            line-height: 1;
            margin-bottom: 4px;
        }

        .cart-item-info h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            font-weight: 500;
            color: var(--ink);
            margin: 0 0 6px;
            line-height: 1.25;
        }

        /* ---------- quantity (flat, no chrome) ---------- */
        .cart-qty {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .cart-qty-btn {
            width: 20px;
            height: 20px;
            border: none;
            background: transparent;
            color: #8A8681;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: grid;
            place-items: center;
            padding: 0;
            transition: color 0.2s ease;
        }

        .cart-qty-btn:hover {
            color: var(--accent);
        }

        .cart-qty-val {
            font-family: 'Jost', sans-serif;
            font-size: 12px;
            color: var(--ink);
            min-width: 16px;
            text-align: center;
            font-weight: 500;
        }

        /* ---------- right column: price over remove ---------- */
        .cart-item-end {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .cart-item-price {
            font-family: 'Jost', sans-serif;
            font-size: 13px;
            color: var(--ink);
            font-weight: 500;
            white-space: nowrap;
        }

        .cart-remove {
            background: none;
            border: none;
            color: #B4AFA8;
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            padding: 2px 4px;
            transition: color 0.2s ease;
        }

        .cart-remove:hover {
            color: var(--accent);
        }

        /* ---------- summary ---------- */
        .cart-summary {
            background: #FAF8F5;
            padding: 16px 16px 18px;
            position: sticky;
            top: calc(var(--hdr-h, 58px) + 16px);
        }

        .cart-summary h2 {
            font-family: 'Jost', sans-serif;
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-weight: 500;
            color: #8A8681;
            margin: 0 0 12px;
        }

        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 5px 0;
            font-family: 'Jost', sans-serif;
            font-size: 12.5px;
            color: var(--body);
        }

        .cart-summary-row span:last-child {
            color: var(--ink);
            font-weight: 500;
        }

        .cart-summary-total {
            position: relative;
            margin-top: 10px;
            padding-top: 12px;
        }

        .cart-summary-total::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 1px;
            background: #EAE5DC;
        }

        .cart-summary-total .cart-summary-row {
            font-size: 14px;
            padding: 0;
            color: var(--ink);
            font-weight: 500;
        }

        .cart-checkout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 11px;
            background: var(--ink);
            color: #fff;
            border: none;
            font-family: 'Jost', sans-serif;
            font-size: 10.5px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-weight: 500;
            cursor: pointer;
            margin-top: 14px;
            transition: background 0.25s ease;
        }

        .cart-checkout-btn:hover {
            background: var(--accent);
        }

        .cart-checkout-btn svg {
            transition: transform 0.25s ease;
        }

        .cart-checkout-btn:hover svg {
            transform: translateX(3px);
        }

        .cart-summary-note {
            font-family: 'Jost', sans-serif;
            font-size: 10px;
            color: #8A8681;
            text-align: center;
            margin-top: 10px;
            line-height: 1.5;
        }

        .cart-continue {
            display: block;
            text-align: center;
            margin: 12px auto 0;
            font-family: 'Jost', sans-serif;
            font-size: 10.5px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink);
            text-decoration: none;
            font-weight: 500;
            width: fit-content;
            transition: color 0.2s ease;
        }

        .cart-continue:hover {
            color: var(--accent);
        }

        /* ---------- empty state ---------- */
        .cart-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 40vh;
            text-align: center;
            padding: 32px 16px 40px;
        }

        .cart-empty-icon {
            color: #C4BFB7;
            margin-bottom: 16px;
        }

        .cart-empty-title {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 22px;
            color: var(--ink);
            margin: 0 0 6px;
        }

        .cart-empty-text {
            font-size: 12.5px;
            color: var(--body);
            max-width: 320px;
            margin: 0 0 18px;
            line-height: 1.6;
        }

        .cart-empty-btn {
            display: inline-block;
            padding: 11px 26px;
            background: var(--ink);
            color: #fff;
            text-decoration: none;
            font-size: 10.5px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-family: 'Jost', sans-serif;
            font-weight: 500;
            transition: background 0.25s ease;
        }

        .cart-empty-btn:hover {
            background: var(--accent);
        }

        /* ---------- responsive ---------- */
        /* Desktop scale-up. The base sizing above is phone-first — 64px
           thumbnails, 15px names, a 268px summary — and on a 1440-1800px
           column that read as a mobile layout stretched wide, with the
           content occupying a thin band down the middle. Everything below
           is proportion, not new structure: bigger plates, larger type, a
           summary panel with real weight.

           .cart-page declares no horizontal padding here — it shares its
           element with .wrap, which owns the page gutter. */
        @media (min-width: 1024px) {
            .cart-head {
                padding-bottom: 18px;
                gap: 14px;
            }

            .cart-title {
                font-size: 44px;
            }

            .cart-count {
                font-size: 11.5px;
            }

            .cart-layout {
                grid-template-columns: 1fr 440px;
                gap: 64px;
            }

            /* the plate leads the row, so it sets the row's height */
            .cart-item {
                grid-template-columns: 180px 1fr auto;
                gap: 34px;
                padding: 28px 0;
            }

            .cart-item-img {
                width: 180px;
                height: 180px;
            }

            .cart-item-cat {
                font-size: 10px;
                margin-bottom: 7px;
            }

            .cart-item-info h3 {
                font-size: 26px;
                margin-bottom: 14px;
            }

            .cart-qty {
                gap: 8px;
            }

            .cart-qty-btn {
                width: 32px;
                height: 32px;
                font-size: 18px;
                background: #FAF8F5;
            }

            .cart-qty-val {
                font-size: 15px;
                min-width: 26px;
            }

            .cart-item-end {
                gap: 10px;
            }

            .cart-item-price {
                font-size: 19px;
            }

            .cart-remove {
                font-size: 19px;
            }

            .cart-summary {
                padding: 32px 30px 34px;
            }

            .cart-summary h2 {
                font-size: 12px;
                margin-bottom: 22px;
            }

            .cart-summary-row {
                font-size: 15.5px;
                padding: 9px 0;
            }

            .cart-summary-total {
                margin-top: 14px;
                padding-top: 16px;
            }

            .cart-summary-total .cart-summary-row {
                font-size: 21px;
            }

            .cart-checkout-btn {
                padding: 18px;
                font-size: 12.5px;
                letter-spacing: 0.18em;
                margin-top: 24px;
            }

            .cart-summary-note {
                font-size: 11.5px;
                margin-top: 16px;
            }

            .cart-continue {
                font-size: 12px;
                margin-top: 18px;
            }

            .cart-empty {
                min-height: 52vh;
            }

            .cart-empty-icon {
                width: 48px;
                height: 48px;
            }

            .cart-empty-title {
                font-size: 30px;
            }

            .cart-empty-text {
                font-size: 14px;
                max-width: 380px;
            }

            .cart-empty-btn {
                padding: 14px 34px;
                font-size: 11.5px;
            }
        }

        @media (max-width: 900px) {
            .cart-layout {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .cart-summary {
                position: static;
            }
        }

        @media (max-width: 600px) {
            /* a little larger than the old 56px, so the piece is legible
               at a glance on a phone */
            .cart-item {
                grid-template-columns: 78px 1fr auto;
                gap: 14px;
                padding: 12px 0;
            }

            .cart-item-img {
                width: 78px;
                height: 78px;
            }
        }
    </style>
</head>

<body>

    <div id="site-header"></div>

    <main class="wrap cart-page">
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="/index.html">Home</a>
            <span class="sep">|</span>
            <span>Your Cart</span>
        </nav>

        <!-- a <header> here would match the global `header { position: fixed }`
             desktop rule in styles.css and pin the title over the site nav -->
        <div class="cart-head">
            <h1 class="cart-title">Your Cart</h1>
            <!-- id is cartItemCount, not cartCount: the header badge in
                 partials/header.html already owns that id, so this element
                 was a duplicate and getElementById returned the header's.
                 The result was "3 items" rendered inside the small round
                 nav badge while this line stayed empty. -->
            <span class="cart-count" id="cartItemCount"></span>
        </div>

        <div id="cartContent"></div>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/js/include.js"></script>
    <script type="module">
        import { getCart, saveCart, removeFromCart, updateCartQty } from '../js/shop.js';
        import { openCheckout } from '../js/checkout.js';
        // category names from js/taxonomy.js — the local map that used to
        // live here listed five categories, so an Accents or Souvenir line
        // in the cart showed its raw slug
        import { categoryTitle } from '../js/taxonomy.js';

        const cartContent = document.getElementById('cartContent');
        const cartItemCount = document.getElementById('cartItemCount');

        function parsePrice(priceStr) {
            return Number.parseInt(String(priceStr).replace(/\D/g, ''), 10) || 0;
        }


        function renderCart() {
            const cart = getCart();

            // Update item count
            const totalItems = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            cartItemCount.textContent = totalItems > 0 ? `${totalItems} ${totalItems === 1 ? 'item' : 'items'}` : '';

            if (cart.length === 0) {
                cartContent.innerHTML = `
                    <section class="cart-empty">
                        <svg class="cart-empty-icon" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 01-8 0"></path>
                        </svg>
                        <h1 class="cart-empty-title">Your cart is empty</h1>
                        <p class="cart-empty-text">
                            Explore our collections — handcrafted for considered living.
                        </p>
                        <a href="/pages/collection.html" class="cart-empty-btn">Explore Collections</a>
                    </section>`;
                return;
            }

            let subtotal = 0;
            cart.forEach(item => {
                subtotal += parsePrice(item.price) * (item.qty || 1);
            });
            const discount = coupon ? Math.min(coupon.discount, subtotal) : 0;
            const shipping = (subtotal - discount) >= 5000 ? 0 : 150;
            const total = subtotal - discount + shipping;

            let itemsHtml = '';
            cart.forEach(item => {
                const lineTotal = parsePrice(item.price) * (item.qty || 1);
                const catLabel = categoryTitle(item.cat);
                const href = `/pages/product.html?${item.id ? `id=${item.id}&` : ''}cat=${item.cat}&idx=${item.idx}`;
                itemsHtml += `
                    <div class="cart-item" data-cat="${item.cat}" data-idx="${item.idx}" data-variant="${item.variant || ''}">
                        <a href="${href}" class="cart-item-link">
                            <div class="cart-item-img"><img src="${item.img}" alt="${item.name}" loading="lazy"></div>
                        </a>
                        <div class="cart-item-info">
                            ${catLabel ? `<div class="cart-item-cat">${catLabel}</div>` : ''}
                            <a href="${href}" class="cart-item-link">
                                <h3>${item.name}${item.variant ? ` <span style="font-size:0.8em;color:#8d887e;">· ${item.variant}</span>` : ''}</h3>
                            </a>
                            <div class="cart-qty">
                                <button class="cart-qty-btn cart-qty-minus" aria-label="Decrease quantity">−</button>
                                <span class="cart-qty-val">${item.qty || 1}</span>
                                <button class="cart-qty-btn cart-qty-plus" aria-label="Increase quantity">+</button>
                            </div>
                        </div>
                        <div class="cart-item-end">
                            <button class="cart-remove" aria-label="Remove ${item.name} from cart" title="Remove">&times;</button>
                            <div class="cart-item-price">₹ ${lineTotal.toLocaleString('en-IN')}</div>
                        </div>
                    </div>`;
            });

            cartContent.innerHTML = `
                <div class="cart-layout">
                    <div class="cart-items">${itemsHtml}</div>
                    <aside class="cart-summary">
                        <h2>Order Summary</h2>
                        <div class="cart-summary-row">
                            <span>Subtotal</span>
                            <span>₹ ${subtotal.toLocaleString('en-IN')}</span>
                        </div>
                        ${discount ? `
                        <div class="cart-summary-row" style="color:#1e6b1e;">
                            <span>Coupon ${coupon.code}</span>
                            <span>− ₹ ${discount.toLocaleString('en-IN')}</span>
                        </div>` : ''}
                        <div class="cart-summary-row">
                            <span>Shipping</span>
                            <span>${shipping === 0 ? 'Complimentary' : '₹ ' + shipping}</span>
                        </div>
                        <div class="cart-coupon" style="display:flex;gap:8px;margin:12px 0 4px;">
                            <input id="couponInput" placeholder="Coupon code" value="${coupon ? coupon.code : ''}"
                                style="flex:1;padding:9px 12px;border:1px solid #d9d3c7;border-radius:2px;font:inherit;font-size:13px;text-transform:uppercase;">
                            <button id="couponBtn" type="button"
                                style="padding:9px 16px;background:${coupon ? '#8d887e' : '#141210'};color:#fff;border:0;border-radius:2px;font:inherit;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;">${coupon ? 'Remove' : 'Apply'}</button>
                        </div>
                        <div id="couponNote" style="font-size:12px;color:#b03030;min-height:15px;"></div>
                        <div class="cart-summary-total">
                            <div class="cart-summary-row">
                                <span>Total</span>
                                <span>₹ ${total.toLocaleString('en-IN')}</span>
                            </div>
                        </div>
                        <button class="cart-checkout-btn">
                            <span>Checkout</span>
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </button>
                        <p class="cart-summary-note">Free shipping above ₹ 5,000 · 7-day returns</p>
                        <a href="/pages/collection.html" class="cart-continue">Continue Shopping</a>
                    </aside>
                </div>`;

            // Wire up qty + remove buttons (variant-aware: the same product
            // can sit in the cart twice with different options)
            cartContent.querySelectorAll('.cart-item').forEach(el => {
                const cat = el.dataset.cat;
                const idx = Number.parseInt(el.dataset.idx, 10);
                const variant = el.dataset.variant || null;
                const qtyVal = el.querySelector('.cart-qty-val');
                const findItem = () => getCart().find(p =>
                    p.cat === cat && p.idx === idx && (p.variant || null) === variant);

                el.querySelector('.cart-qty-minus').addEventListener('click', () => {
                    const item = findItem();
                    if (item && item.qty > 1) {
                        updateCartQty(cat, idx, item.qty - 1, variant);
                        qtyVal.textContent = item.qty - 1;
                        renderCart();
                    }
                });

                el.querySelector('.cart-qty-plus').addEventListener('click', () => {
                    const item = findItem();
                    if (item) {
                        updateCartQty(cat, idx, item.qty + 1, variant);
                        qtyVal.textContent = item.qty + 1;
                        renderCart();
                    }
                });

                el.querySelector('.cart-remove').addEventListener('click', () => {
                    el.classList.add('removing');
                    setTimeout(() => {
                        removeFromCart(cat, idx, variant);
                        renderCart();
                    }, 280);
                });
            });

            // Coupon apply / remove
            const couponBtn = document.getElementById('couponBtn');
            if (couponBtn) {
                couponBtn.addEventListener('click', async () => {
                    if (coupon) { coupon = null; renderCart(); return; }
                    const code = document.getElementById('couponInput').value.trim();
                    const note = document.getElementById('couponNote');
                    if (!code) return;
                    try {
                        const res = await fetch('/api/coupon/validate', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ code, items: cartItemsPayload() }),
                        });
                        const j = await res.json();
                        if (!res.ok) { note.textContent = j.error || 'Invalid coupon'; return; }
                        coupon = { code: j.code, discount: j.discount };
                        renderCart();
                    } catch { note.textContent = 'Could not check that code.'; }
                });
            }
        }

        // Coupon survives re-renders within the visit. If it is restricted to
        // a particular email/phone, the final say is the server's at checkout.
        let coupon = null;

        const cartItemsPayload = () => getCart().map(i => ({
            id: i.id, cat: i.cat, idx: i.idx, qty: i.qty || 1, name: i.name, variant: i.variant || null,
        }));

        renderCart();

        // Listen for cart changes from other tabs
        window.addEventListener('vayu:cart-changed', renderCart);

        /* ------------------------------------------------------------------
           Checkout — the dialog lives in js/checkout.js, which offers the
           guest / sign-in / register choice and then posts to /api/checkout.
           This page only hands it the cart and clears it afterwards. */

        function startCheckout({ track = true } = {}) {
            if (!getCart().length) return;

            if (track) {
                try {
                    navigator.sendBeacon?.('/api/track', new Blob(
                        [JSON.stringify({ type: 'checkoutStart', sid: localStorage.getItem('vayu_sid') || '' })],
                        { type: 'application/json' }));
                } catch { /* ignore */ }
            }

            openCheckout({
                getItems: cartItemsPayload,
                getCoupon: () => (coupon ? coupon.code : null),
                onPlaced: () => { saveCart([]); coupon = null; },
            });
        }

        cartContent.addEventListener('click', (e) => {
            if (e.target.closest('.cart-checkout-btn')) startCheckout();
        });

        // Coming back from Google: signing in is a full-page round trip, so
        // reopen the dialog where the shopper left it. Not counted as a
        // second checkout start — it is the same one, resumed.
        if (new URLSearchParams(location.search).has('checkout')) {
            history.replaceState(null, '', location.pathname);
            startCheckout({ track: false });
        }
    </script>
    <style>
        .checkout-veil {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(20, 18, 16, 0.45);
            display: grid; place-items: center; padding: 20px;
        }
        .checkout-card {
            background: #fff; border-radius: 14px; padding: 34px 32px;
            width: 100%; max-width: 520px; box-shadow: 0 30px 80px rgba(20, 18, 16, 0.3);
        }
        .checkout-card h2 { font-family: 'Cormorant Garamond', serif; font-size: 28px; margin: 0 0 18px; }
        .co-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
        .co-grid .co-full { grid-column: 1 / -1; }
        .co-grid label { display: grid; gap: 5px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--body, #4E4A43); }
        .co-grid input { padding: 10px 12px; border: 1px solid #e6e1d6; border-radius: 8px; font: inherit; font-size: 14px; }
        .co-grid input:focus { outline: 2px solid var(--accent, #9E3A26); outline-offset: -1px; }
        .co-error { color: #b03030; font-size: 13px; min-height: 17px; margin: 10px 0 0; }
        .co-actions { display: flex; gap: 12px; justify-content: flex-end; align-items: center; margin-top: 8px; flex-wrap: wrap; }

        /* ---- sign in / register / guest ---- */
        .co-loading { color: #8d887e; font-size: 14px; margin: 0; padding: 12px 0; text-align: center; }
        .co-lede { color: #8d887e; font-size: 13.5px; line-height: 1.6; margin: -8px 0 18px; }
        .co-choice { display: grid; gap: 10px; }
        .co-choice .cart-checkout-btn { width: 100%; }
        .co-alt {
            padding: 12px 18px; background: #fff; border: 1px solid #e6e1d6; border-radius: 8px;
            font: inherit; font-size: 13px; cursor: pointer; color: var(--body, #4E4A43);
        }
        .co-alt:hover { border-color: #141210; }
        /* Google's button: their mark, our shape. !important on the border
           because styles.css forces border-color: transparent on everything. */
        .co-google {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 12px 18px; border: 1px solid #C9C0AE !important; border-radius: 8px;
            background: #fff; color: #141210; text-decoration: none;
            font: inherit; font-size: 14px; cursor: pointer;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .co-google:hover { border-color: #141210 !important; box-shadow: 0 1px 6px rgba(20, 18, 16, .09); }
        .co-google svg { flex: none; }

        /* "or" with a rule through it, separating Google from the email form */
        .co-or {
            display: flex; align-items: center; gap: 12px;
            margin: 14px 0; font-size: 12px; color: #8d887e;
            text-transform: uppercase; letter-spacing: .14em;
        }
        .co-or::before, .co-or::after {
            content: ''; flex: 1; height: 1px; background: #E6E1D6;
        }

        .co-auth { display: grid; gap: 12px; }
        .co-auth label { display: grid; gap: 5px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--body, #4E4A43); }
        .co-auth input { padding: 10px 12px; border: 1px solid #e6e1d6; border-radius: 8px; font: inherit; font-size: 14px; }
        .co-auth input:focus { outline: 2px solid var(--accent, #9E3A26); outline-offset: -1px; }
        .co-link {
            background: none; border: 0; padding: 0; font: inherit; font-size: 13px;
            text-decoration: underline; cursor: pointer; color: var(--body, #4E4A43);
        }
        .co-who { font-size: 13px; color: var(--body, #4E4A43); margin: -8px 0 14px; }
        .co-who .co-link { margin-left: 6px; color: #8d887e; }
        .co-summary {
            background: #faf8f4; border: 1px solid #eee9dd; border-radius: 8px;
            padding: 14px 16px; margin-bottom: 14px; font-size: 14px; line-height: 1.7;
        }
        .co-picker select {
            padding: 10px 12px; border: 1px solid #e6e1d6; border-radius: 8px;
            font: inherit; font-size: 14px; background: #fff; width: 100%;
        }
        .co-check {
            display: flex; align-items: center; gap: 8px; margin-top: 12px;
            font-size: 13px; color: var(--body, #4E4A43);
        }
        .co-check input { width: 15px; height: 15px; }
        .co-cancel { background: none; border: 0; cursor: pointer; font: inherit; font-size: 13px; text-decoration: underline; color: var(--body, #4E4A43); }
        .co-submit { width: auto; padding: 12px 28px; }
        .co-done { text-align: center; padding: 10px 0 4px; }
        .co-done p { color: var(--body, #4E4A43); line-height: 1.7; margin: 10px 0 22px; }
        @media (max-width: 520px) { .co-grid { grid-template-columns: 1fr; } }
    </style>
