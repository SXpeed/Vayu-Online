<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection - Vayu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=118">
</head>

<body>

  <div id="site-header"></div>

  <main class="wrap collection-page">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/index.html">Home</a>
      <span class="sep">|</span>
      <span>Collection</span>
    </nav>

    <!-- The Sort control that used to sit here was inert twice over: this
         page is a directory of category banners with no product grid, so
         the sort code in script.js (gated on #collectionGrid) never bound
         to it; and its <option>s had no value attributes, so even wired it
         would have fallen through to "featured" on every choice. Sorting
         belongs on collection-detail.html, which has both. -->
    <!-- Category banners with their sub-category carousels, rendered from
         js/taxonomy.js by js/nav-render.js. This directory used to be
         hand-written alongside five other copies of the same list, and had
         drifted: it was missing Bowls, Candle Holders, Ceramic and Textile,
         and linked ?sub=linen and ?sub=glass — two slugs that exist nowhere
         in the taxonomy, so both landed on an empty grid. -->
    <section class="collection-directory" id="collectionDirectory"></section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="/js/include.js"></script>

</body>

</html>
