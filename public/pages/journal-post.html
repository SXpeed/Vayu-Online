<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal — Vayu</title>
  <meta name="description" content="A story from the Vayu Journal — craft, heritage and mindful living.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=118">
  <style>
    /* ---- article page ------------------------------------------------
       The destination the Journal listing's cards always promised. Every
       card and the featured block used to be href="javascript:void(0)".
       ------------------------------------------------------------------ */
    .post-page {
      padding-bottom: 80px;
    }

    .post-hero {
      position: relative;
      width: 100%;
      aspect-ratio: 21 / 9;
      overflow: hidden;
      background: #FAF8F5;
      margin-bottom: 34px;
    }

    .post-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* one measured column for reading, centred in the page column */
    .post-body-wrap {
      max-width: 46em;
      margin: 0 auto;
    }

    .post-cat {
      display: inline-block;
      font-family: 'Jost', sans-serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .post-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(30px, 4vw, 50px);
      font-weight: 400;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 14px;
    }

    .post-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8A8681;
      margin-bottom: 26px;
      padding-bottom: 20px;
      /* drawn as a background so the flat layer's transparent border-color
         cannot erase it */
      background-image: linear-gradient(#EFEAE1, #EFEAE1);
      background-size: 100% 1px;
      background-position: 0 100%;
      background-repeat: no-repeat;
    }

    .post-meta-dot {
      color: #C3BDB3;
    }

    .post-lead {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(18px, 2vw, 22px);
      font-weight: 400;
      font-style: italic;
      line-height: 1.55;
      color: var(--ink);
      margin-bottom: 26px;
    }

    .post-body p {
      font-size: 15.5px;
      line-height: 1.85;
      color: var(--body);
      margin-bottom: 20px;
    }

    /* Shown when a story has no `body` paragraphs yet. Deliberately an
       honest editorial placeholder rather than invented copy — see the
       authoring notes in js/journal-data.js. */
    .post-pending {
      background: #FAF8F5;
      padding: 22px 24px;
      margin-bottom: 28px;
    }

    .post-pending h2 {
      font-family: 'Jost', sans-serif;
      font-size: 10.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .post-pending p {
      font-size: 14px;
      line-height: 1.7;
      color: var(--body);
      margin: 0;
    }

    .post-foot {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-top: 40px;
      padding-top: 24px;
      background-image: linear-gradient(#EFEAE1, #EFEAE1);
      background-size: 100% 1px;
      background-position: 0 0;
      background-repeat: no-repeat;
    }

    .post-back,
    .post-next {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--ink);
      transition: color 0.2s ease;
    }

    .post-back:hover,
    .post-next:hover {
      color: var(--accent);
    }

    .post-next {
      text-align: right;
      max-width: 60%;
    }

    /* ---- more stories ---- */
    .post-more {
      margin-top: 60px;
    }

    .post-more-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .post-more-card {
      display: flex;
      flex-direction: column;
    }

    .post-more-media {
      display: block;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      background: #FAF8F5;
      margin-bottom: 12px;
    }

    .post-more-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .post-more-card:hover .post-more-media img {
      transform: scale(1.04);
    }

    .post-more-cat {
      font-family: 'Jost', sans-serif;
      font-size: 9.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
      margin-bottom: 5px;
    }

    .post-more-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      font-weight: 500;
      line-height: 1.25;
      color: var(--ink);
      transition: color 0.2s ease;
    }

    .post-more-card:hover .post-more-title {
      color: var(--accent);
    }

    /* ---- story not found ---- */
    .post-missing {
      padding: 70px 16px 90px;
      text-align: center;
    }

    @media (max-width: 1023px) {
      .post-more-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      .post-hero {
        aspect-ratio: 4 / 3;
        margin-bottom: 24px;
      }

      .post-more-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .post-next {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <div id="site-header"></div>

  <main class="wrap post-page">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/index.html">Home</a>
      <span class="sep">|</span>
      <a href="/pages/journal.html">Journal</a>
      <span class="sep" id="crumbSep" style="display:none;">|</span>
      <span id="crumbTitle"></span>
    </nav>

    <article id="postRoot"></article>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="/js/include.js"></script>
  <script type="module">
    import { STORIES, getStory, postUrl } from '/js/journal-data.js';

    const esc = (s) => String(s).replace(/[&<>"]/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
    ));

    const root = document.getElementById('postRoot');
    const id = new URLSearchParams(location.search).get('id') || '';
    const story = getStory(id);

    if (!story) {
      document.title = 'Story not found — Vayu';
      root.innerHTML = `
        <section class="post-missing">
          <h1 class="post-title">We couldn't find that story</h1>
          <p style="font-size:14px;color:var(--body);margin-bottom:22px;">
            The link may be out of date.
          </p>
          <a class="post-back" href="/pages/journal.html">← Back to the Journal</a>
        </section>`;
    } else {
      document.title = `${story.title} — Vayu Journal`;
      document.querySelector('meta[name="description"]')
        ?.setAttribute('content', story.excerpt);

      const crumb = document.getElementById('crumbTitle');
      const crumbSep = document.getElementById('crumbSep');
      if (crumb) crumb.textContent = story.title;
      if (crumbSep) crumbSep.style.display = 'inline';

      // Where a story has no body paragraphs, show the excerpt as the lead
      // plus an honest note — rather than fabricating editorial copy about
      // the artisans and places these stories describe.
      const hasBody = Array.isArray(story.body) && story.body.length > 0;
      const bodyHTML = hasBody
        ? `<div class="post-body">${story.body.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
        : `<div class="post-pending">
             <h2>Full story in preparation</h2>
             <p>This piece is being written up for the Journal. In the meantime,
                the summary above covers what it will explore.</p>
           </div>`;

      // "next" = the following story in the list, wrapping at the end
      const i = STORIES.findIndex(s => s.id === story.id);
      const next = STORIES[(i + 1) % STORIES.length];

      const more = STORIES.filter(s => s.id !== story.id).slice(0, 3);

      root.innerHTML = `
        <div class="post-hero">
          <img src="${esc(story.image)}" alt="${esc(story.alt)}" fetchpriority="high">
        </div>

        <div class="post-body-wrap">
          <span class="post-cat">${esc(story.categoryLabel)}</span>
          <h1 class="post-title">${esc(story.title)}</h1>
          <div class="post-meta">
            <span>${esc(story.date)}</span>
            ${story.readingTime ? `<span class="post-meta-dot">·</span><span>${esc(story.readingTime)}</span>` : ''}
          </div>

          <p class="post-lead">${esc(story.excerpt)}</p>
          ${bodyHTML}

          <div class="post-foot">
            <a class="post-back" href="/pages/journal.html">← All stories</a>
            ${next && next.id !== story.id
          ? `<a class="post-next" href="${postUrl(next)}">Next: ${esc(next.title)} →</a>`
          : ''}
          </div>
        </div>

        ${more.length ? `
        <section class="post-more" aria-labelledby="more-title">
          <div class="sec-head">
            <h2 class="sec-title" id="more-title">MORE FROM THE JOURNAL</h2>
            <a class="link-cta" href="/pages/journal.html">VIEW ALL &nbsp;→</a>
          </div>
          <div class="post-more-grid">
            ${more.map(s => `
              <a class="post-more-card" href="${postUrl(s)}">
                <span class="post-more-media">
                  <img src="${esc(s.image)}" alt="${esc(s.alt)}" loading="lazy">
                </span>
                <span class="post-more-cat">${esc(s.categoryLabel)}</span>
                <span class="post-more-title">${esc(s.title)}</span>
              </a>`).join('')}
          </div>
        </section>` : ''}
      `;
    }
  </script>

</body>

</html>
