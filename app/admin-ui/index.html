<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Vayu — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/admin/admin.css">
</head>

<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="side-brand">Vayu</div>
            <div class="side-tag">Design For Living</div>
            <nav class="side-nav" id="side-nav">
                <a href="#/dashboard" data-view="dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <rect x="3" y="3" width="8" height="8" rx="1.5" />
                        <rect x="13" y="3" width="8" height="5" rx="1.5" />
                        <rect x="13" y="10" width="8" height="11" rx="1.5" />
                        <rect x="3" y="13" width="8" height="8" rx="1.5" />
                    </svg>
                    Dashboard</a>
                <a href="#/products" data-view="products">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <path d="M21 8l-9-5-9 5v8l9 5 9-5V8z" />
                        <path d="M3 8l9 5 9-5M12 13v8" />
                    </svg>
                    Products</a>
                <a href="#/categories" data-view="categories">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <path d="M4 4h7l9 9-7 7-9-9V4z" />
                        <circle cx="8.5" cy="8.5" r="1.3" />
                    </svg>
                    Categories</a>
                <a href="#/coupons" data-view="coupons" data-need="manager">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <path
                            d="M3 9V6a1 1 0 011-1h16a1 1 0 011 1v3a2.5 2.5 0 000 6v3a1 1 0 01-1 1H4a1 1 0 01-1-1v-3a2.5 2.5 0 000-6z" />
                        <path d="M13 5v2M13 11v2M13 17v2" />
                    </svg>
                    Coupons</a>
                <a href="#/orders" data-view="orders">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <path d="M6 2l-2 5v13a1.5 1.5 0 001.5 1.5h13A1.5 1.5 0 0020 20V7l-2-5H6z" />
                        <path d="M4 7h16M9 11a3 3 0 006 0" />
                    </svg>
                    Orders <span class="badge" id="orders-badge" hidden></span></a>
                <a href="#/customers" data-view="customers">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <circle cx="9" cy="8" r="3.5" />
                        <path
                            d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 5a3.5 3.5 0 010 6.5M21.5 20c-.5-2.4-1.8-4.1-3.7-5" />
                    </svg>
                    Customers</a>
                <a href="#/analytics" data-view="analytics">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <path d="M3 21h18M6 17v-6M11 17V7M16 17v-4M21 17V4" />
                    </svg>
                    Analytics</a>
                <a href="#/inventory" data-view="inventory" data-need="manager">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <path d="M3 7l9-4 9 4v10l-9 4-9-4V7z" />
                        <path d="M3 7l9 4 9-4M12 11v10" />
                        <path d="M7.5 5l9 4" />
                    </svg>
                    Inventory</a>
                <a href="#/events" data-view="events" data-need="manager">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <rect x="3" y="4" width="18" height="17" rx="2" />
                        <path d="M8 2v4M16 2v4M3 10h18" />
                    </svg>
                    What&rsquo;s On</a>
                <a href="#/artists" data-view="artists" data-need="manager">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <circle cx="12" cy="8" r="3.2" />
                        <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6" />
                    </svg>
                    Artists</a>
                <a href="#/press" data-view="press" data-need="manager">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <path d="M4 22h14a2 2 0 002-2V4a2 2 0 00-2-2H6a2 2 0 00-2 2v16" />
                        <path d="M18 14h2a2 2 0 012 2v2a2 2 0 01-2 2h-2" />
                        <path d="M8 6h6M8 10h6M8 14h4" />
                    </svg>
                    Press</a>
                <a href="#/content" data-view="content" data-need="manager">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <rect x="3" y="4" width="18" height="14" rx="2" />
                        <path d="M3 9h18M7 21h10" />
                    </svg>
                    Site content</a>
                <a href="#/curated-spaces" data-view="curated-spaces" data-need="manager">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <path d="M3 21V9l9-6 9 6v12" />
                        <path d="M9 21v-7h6v7" />
                    </svg>
                    Curated Spaces</a>
                <a href="#/outbox" data-view="outbox">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <rect x="3" y="5" width="18" height="14" rx="2" />
                        <path d="M3 7l9 6 9-6" />
                    </svg>
                    Outbox <span class="badge" id="outbox-badge" hidden></span></a>
                <a href="#/team" data-view="team" data-need="owner">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <circle cx="12" cy="7.5" r="3.5" />
                        <path d="M5 20c.9-3.6 3.7-5.5 7-5.5s6.1 1.9 7 5.5" />
                    </svg>
                    Team</a>
                <a href="#/activity" data-view="activity">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M12 7v5l3.5 2" />
                    </svg>
                    Activity</a>
                <a href="#/settings" data-view="settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.5 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 000 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2L10 21h4l.5-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.06-.4.1-.8.1-1.2z" />
                    </svg>
                    Settings</a>
            </nav>
            <div class="side-foot">
                <a href="/" target="_blank" rel="noopener">View storefront ↗</a>
            </div>
        </aside>

        <main class="main">
            <div class="topbar">
                <h1 id="view-title">Dashboard</h1>
                <div class="spacer"></div>
                <div class="top-user">
                    <b id="admin-name">—</b>
                    <button class="link-btn" id="logout-btn">Sign out</button>
                </div>
            </div>
            <div id="view"></div>
        </main>
    </div>

    <div id="modal-root"></div>
    <div class="toast" id="toast"></div>
    <script type="module" src="/admin/admin.js"></script>
</body>

</html>
