<!DOCTYPE html>
<html lang="en">

<head>

  <title>Collection - Vayu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link

  <link rel="stylesheet" href="/css/styles.css?v=20">

<body>

  <div id="site-header"></div>

      <span class="sep">|</span>
      <span>Collection</span>
    </nav>

    <div class="page-header">
      <h1>All Collections</h1>
      <div class="ctrl-group">

        <a class="collection-cat-banner" href="/pages/collection-detail.html?cat=fashion">

          <div class="collection-cat-overlay">
            <h2>Fashion</h2>
          </div>
        </a>
        <div class="collection-sub-carousel">
