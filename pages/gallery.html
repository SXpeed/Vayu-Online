<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Vayu — Vayu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=20">
</head>

<body>

  <div id="site-header"></div>

  <main class="wrap gallery-page">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/index.html">Home</a>
      <span class="sep">|</span>
      <span>Gallery Vayu</span>
    </nav>

        <header class="g-head">
            <div>
                <span class="g-eyebrow">Gallery Vayu &middot; New Delhi</span>
                <h1 class="g-title">Echoes of Craft</h1>
            </div>
            <div class="g-meta">On view till 10 August 2026</div>
        </header>

        <section class="gallery-fit">
            <figure class="g-fit-card">
                <img src="/assets/images/gallery.jpg" alt="Echoes of Craft exhibition">
                <figcaption>The Exhibition</figcaption>
            </figure>
            <figure class="g-fit-card">
                <img src="/assets/images/hero.jpg" alt="Vayu campaign">
                <figcaption>The Campaign</figcaption>
            </figure>
            <figure class="g-fit-card">
                <img src="/assets/images/makers.jpg" alt="Artisan at work">
                <figcaption>The Makers</figcaption>
            </figure>
        </section>
        <style>
            /* ---------- editorial header ---------- */
            .g-head {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                gap: 24px;
                margin-bottom: 20px;
            }
            .g-eyebrow {
                display: block;
                font-size: 11px;
                letter-spacing: 0.26em;
                text-transform: uppercase;
                color: var(--accent);
                font-weight: 500;
                margin-bottom: 8px;
            }
            .g-title {
                font-family: 'Cormorant Garamond', serif;
                font-size: clamp(30px, 3.4vw, 52px);
                font-weight: 400;
                letter-spacing: -0.01em;
                line-height: 1;
                color: var(--ink);
                margin: 0;
            }
            .g-meta {
                font-size: 12px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: #8a8a86;
                padding-bottom: 6px;
                white-space: nowrap;
            }

            /* ---------- whole gallery fits one screen — no scrolling ---------- */
            .gallery-fit {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
                height: calc(100dvh - 210px);
                min-height: 300px;
                margin-bottom: 24px;
            }
            .g-fit-card {
                position: relative;
                margin: 0;
                border-radius: 20px;
                overflow: hidden;
                border: 1px solid var(--line);
                box-shadow: var(--shadow);
                background: var(--card);
            }
            .g-fit-card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .g-fit-card figcaption {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                padding: 26px 24px 18px;
                background: linear-gradient(to top, rgba(20, 18, 16, 0.65), transparent);
                color: #fff;
                font-size: 12px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                font-weight: 500;
            }
            .g-fit-card:hover img { transform: scale(1.04); }

            /* ---------- desktop refinements ---------- */
            @media (min-width: 1024px) {
                .gallery-page { padding-left: 40px; padding-right: 40px; }
                .gallery-page .breadcrumb { margin-bottom: 6px; }
                .g-head {
                    margin-bottom: 28px;
                    padding-bottom: 22px;
                    border-bottom: 1px solid var(--line);
                }
                .gallery-fit {
                    gap: 24px;
                    height: calc(100dvh - 300px);
                    min-height: 380px;
                }
                .g-fit-card { border-radius: 14px; }
            }

            @media (max-width: 768px) {
                .g-head { flex-direction: column; align-items: flex-start; gap: 6px; margin-bottom: 14px; }
                .gallery-fit {
                    grid-template-columns: 1fr 1fr;
                    grid-auto-rows: 1fr;
                    height: calc(100dvh - 230px);
                }
                /* third image spans the full width so all three fit the grid */
                .g-fit-card:last-child { grid-column: 1 / -1; }
                .g-fit-card figcaption { padding: 18px 14px 12px; font-size: 10px; }
            }
        </style>
        </main>

  <div id="site-footer"></div>

  <script type="module" src="/js/include.js"></script>

</body>

</html>
