<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Products — Vayu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css?v=20">
</head>

<body>

    <div id="site-header"></div>

    <main class="wrap collection-page">
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="/index.html">Home</a>
            <span class="sep">|</span>
            <a href="/pages/collection.html">Collection</a>
            <span class="sep">|</span>
            <a id="crumbCategory">Category</a>
            <span class="sep" id="crumbSep" style="display:none;">|</span>
            <span id="crumbSub" style="display:none;">Sub</span>
        </nav>
        <div class="collection-banner-219"
            style="width: 100%; aspect-ratio: 21 / 9; max-height: 380px; overflow: hidden; border-radius: 2px; margin-bottom: 4px; position: relative;">
            <img id="catHeroImg" src="/assets/images/hero.jpg" alt="Collection Banner"
                style="width: 100%; height: 100%; object-fit: cover;">
        </div>

        <!-- page-header: same styled card as the collection page (title + sort) -->
        <div class="page-header">
            <h1 id="catTitle">Collection</h1>
            <div class="ctrl-group">
                <label for="collection-sort">Sort</label>
                <select id="collection-sort">
                    <option value="featured">Featured</option>
                    <option value="new-arrivals">New Arrivals</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                </select>
            </div>
        </div>

        <!-- sub-nav pills live below the header bar -->
        <div id="subNav" class="sub-nav"
            style="display: flex; gap: 8px; margin-bottom: 4px; overflow-x: auto; scrollbar-width: none;">
        </div>

        <!-- PRODUCT GRID -->
        <section class="curated-section" id="collectionGrid" style="margin-bottom: 60px;">
            <div class="curated-grid" id="subGrid"></div>
        </section>

        <style>
            .sub-nav .sub-pill {
                display: inline-block;
                padding: 8px 18px;
                border: 1px solid var(--line);
                border-radius: 30px;
                font-size: 13px;
                color: var(--body);
                text-decoration: none;
                letter-spacing: 0.04em;
                background: transparent;
                transition: all 0.2s ease;
                white-space: nowrap;
            }

            .sub-nav .sub-pill:hover {
                border-color: var(--ink);
                color: var(--ink);
            }

            .sub-nav .sub-pill.active {
                background: var(--ink);
                color: #fff;
                border-color: var(--ink);
            }
        </style>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/js/include.js"></script>

</body>

</html>
