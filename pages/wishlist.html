<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link

        rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css?v=20">
</head>

<body>

    <div id="site-header"></div>

    <main class="wrap">
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="/index.html">Home</a>
            <span class="sep">|</span>
            <span>Your Wishlist</span>
        </nav>

        <section class="empty-state"
            style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; text-align: center; padding: 60px 16px; margin-bottom: 50px;">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"
                style="color: var(--body); margin-bottom: 24px; opacity: 0.7;">
                <path
                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />

                Your wishlist is empty</h1>
            <p style="font-size: 14px; color: var(--body); max-width: 420px; margin: 0 0 28px; letter-spacing: 0.02em;">
                Save pieces across fashion, furniture, home and decor to revisit them here.</p>
            <a href="/pages/collection.html" class="hero-full-btn"
                style="display: inline-block; padding: 14px 32px; background: var(--ink); color: #fff; text-decoration: none; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-family: 'Jost', sans-serif;">Explore
                Collections</a>

    <div id="site-footer"></div>

    <script type="module" src="/js/include.js"></script>
